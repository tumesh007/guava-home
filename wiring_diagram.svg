<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace">
  <rect width="1200" height="900" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="600" y="35" fill="#fde68a" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial">Shivansh Home V10.1 — Wiring Diagram</text>
  <text x="600" y="55" fill="#64748b" font-size="12" text-anchor="middle" font-family="Arial">ESP32 DevKit V1 | Tumesh Kakkar | Sangrur, Punjab</text>

  <!-- ESP32 Board -->
  <rect x="430" y="70" width="180" height="580" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2" rx="8"/>
  <rect x="438" y="78" width="164" height="564" fill="#4c1d95" rx="6"/>
  <!-- Chip -->
  <rect x="468" y="260" width="104" height="120" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1.5" rx="4"/>
  <text x="520" y="316" fill="#a5b4fc" font-size="11" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="520" y="330" fill="#6d28d9" font-size="9" text-anchor="middle">DevKit V1</text>
  <!-- USB -->
  <rect x="490" y="638" width="60" height="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" rx="2"/>
  <text x="520" y="646" fill="#818cf8" font-size="7" text-anchor="middle">USB</text>
  
  <!-- Left side GPIO labels -->
  <g fill="#94a3b8" font-size="9" text-anchor="end">
    <text x="428" y="96">3V3</text>
    <text x="428" y="110">GND</text>
    <text x="428" y="124" fill="#4ade80">IO2</text>
    <text x="428" y="138">IO4/DHT</text>
    <text x="428" y="152">IO5/RFID</text>
    <text x="428" y="166">IO12/ECHO</text>
    <text x="428" y="180">IO13/TRIG</text>
    <text x="428" y="194">IO14/BZR</text>
    <text x="428" y="208" fill="#f87171">IO15/R1</text>
    <text x="428" y="222" fill="#f87171">IO16/R2</text>
    <text x="428" y="236">IO17/RST</text>
    <text x="428" y="404">IO21/SDA</text>
    <text x="428" y="418">IO22/SCL</text>
    <text x="428" y="432">IO23/MOSI</text>
    <text x="428" y="446" fill="#f87171">IO25/R3</text>
    <text x="428" y="460" fill="#4ade80">IO26/BTN1</text>
    <text x="428" y="474">IO27/PIR</text>
    <text x="428" y="488">IO32/SOIL</text>
    <text x="428" y="502" fill="#f87171">IO33/R4</text>
    <text x="428" y="516">IO34/LDR</text>
    <text x="428" y="530" fill="#4ade80">IO35/BTN2</text>
    <text x="428" y="544">IO36/RAIN</text>
    <text x="428" y="558">IO39/FSR</text>
  </g>

  <!-- Left pin dots -->
  <g fill="#fbbf24">
    <rect x="430" y="90"  width="6" height="4" rx="1"/>
    <rect x="430" y="104" width="6" height="4" rx="1"/>
    <rect x="430" y="118" width="6" height="4" rx="1"/>
    <rect x="430" y="132" width="6" height="4" rx="1"/>
    <rect x="430" y="146" width="6" height="4" rx="1"/>
    <rect x="430" y="160" width="6" height="4" rx="1"/>
    <rect x="430" y="174" width="6" height="4" rx="1"/>
    <rect x="430" y="188" width="6" height="4" rx="1"/>
    <rect x="430" y="202" width="6" height="4" rx="1"/>
    <rect x="430" y="216" width="6" height="4" rx="1"/>
    <rect x="430" y="230" width="6" height="4" rx="1"/>
    <rect x="430" y="398" width="6" height="4" rx="1"/>
    <rect x="430" y="412" width="6" height="4" rx="1"/>
    <rect x="430" y="426" width="6" height="4" rx="1"/>
    <rect x="430" y="440" width="6" height="4" rx="1"/>
    <rect x="430" y="454" width="6" height="4" rx="1"/>
    <rect x="430" y="468" width="6" height="4" rx="1"/>
    <rect x="430" y="482" width="6" height="4" rx="1"/>
    <rect x="430" y="496" width="6" height="4" rx="1"/>
    <rect x="430" y="510" width="6" height="4" rx="1"/>
    <rect x="430" y="524" width="6" height="4" rx="1"/>
    <rect x="430" y="538" width="6" height="4" rx="1"/>
    <rect x="430" y="552" width="6" height="4" rx="1"/>
  </g>

  <!-- Right side GPIO labels -->
  <g fill="#94a3b8" font-size="9" text-anchor="start">
    <text x="618" y="96">EN</text>
    <text x="618" y="110">GND</text>
    <text x="618" y="124">IO15</text>
    <text x="618" y="138">IO2</text>
    <text x="618" y="152">IO4</text>
    <text x="618" y="166">IO16</text>
    <text x="618" y="180">IO17</text>
    <text x="618" y="194">IO5/SS</text>
    <text x="618" y="208">IO18/SCK</text>
    <text x="618" y="222">IO19/MISO</text>
  </g>

  <!-- Right pin dots -->
  <g fill="#fbbf24">
    <rect x="608" y="90"  width="6" height="4" rx="1"/>
    <rect x="608" y="104" width="6" height="4" rx="1"/>
    <rect x="608" y="118" width="6" height="4" rx="1"/>
    <rect x="608" y="132" width="6" height="4" rx="1"/>
    <rect x="608" y="146" width="6" height="4" rx="1"/>
    <rect x="608" y="160" width="6" height="4" rx="1"/>
    <rect x="608" y="174" width="6" height="4" rx="1"/>
    <rect x="608" y="188" width="6" height="4" rx="1"/>
    <rect x="608" y="202" width="6" height="4" rx="1"/>
    <rect x="608" y="216" width="6" height="4" rx="1"/>
  </g>

  <!-- ═══ LEFT SIDE COMPONENTS ═══ -->

  <!-- DHT11 -->
  <rect x="60" y="128" width="60" height="40" fill="#1e3a5f" stroke="#4ade80" stroke-width="1.5" rx="4"/>
  <text x="90" y="145" fill="#4ade80" font-size="9" text-anchor="middle" font-weight="bold">DHT11</text>
  <text x="90" y="157" fill="#94a3b8" font-size="8" text-anchor="middle">Temp/Hum</text>
  <line x1="120" y1="140" x2="430" y2="135" stroke="#4ade80" stroke-width="1.5"/>
  <text x="280" y="133" fill="#4ade80" font-size="8">GPIO4 + 4.7k↑3V3</text>

  <!-- HC-SR04 with Logic Converter -->
  <rect x="30" y="185" width="80" height="50" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5" rx="4"/>
  <text x="70" y="202" fill="#60a5fa" font-size="9" text-anchor="middle" font-weight="bold">HC-SR04</text>
  <text x="70" y="213" fill="#94a3b8" font-size="8" text-anchor="middle">Ultrasonic</text>
  <text x="70" y="224" fill="#64748b" font-size="7" text-anchor="middle">5V sensor</text>
  <!-- Logic converter box -->
  <rect x="200" y="178" width="80" height="44" fill="#0e3040" stroke="#0891b2" stroke-width="1" rx="3"/>
  <text x="240" y="196" fill="#22d3ee" font-size="8" text-anchor="middle" font-weight="bold">Logic Conv.</text>
  <text x="240" y="207" fill="#0891b2" font-size="7" text-anchor="middle">BSS138</text>
  <text x="240" y="216" fill="#64748b" font-size="7" text-anchor="middle">5V ↔ 3.3V</text>
  <line x1="110" y1="198" x2="200" y2="198" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="110" y1="210" x2="200" y2="210" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="155" y="196" fill="#64748b" font-size="7">ECHO</text>
  <text x="155" y="208" fill="#64748b" font-size="7">TRIG</text>
  <line x1="280" y1="196" x2="430" y2="163" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="280" y1="210" x2="430" y2="177" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="340" y="161" fill="#60a5fa" font-size="7">GPIO12</text>
  <text x="340" y="175" fill="#60a5fa" font-size="7">GPIO13</text>

  <!-- Buzzer -->
  <circle cx="90" cy="270" r="18" fill="#1e3a5f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="90" y="268" fill="#fbbf24" font-size="8" text-anchor="middle">BZR</text>
  <text x="90" y="278" fill="#94a3b8" font-size="7" text-anchor="middle">Active</text>
  <line x1="108" y1="268" x2="430" y2="191" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="270" y="238" fill="#fbbf24" font-size="8">GPIO14</text>

  <!-- PIR -->
  <rect x="55" y="320" width="70" height="40" fill="#1e3a5f" stroke="#f97316" stroke-width="1.5" rx="4"/>
  <text x="90" y="337" fill="#f97316" font-size="9" text-anchor="middle" font-weight="bold">PIR</text>
  <text x="90" y="348" fill="#94a3b8" font-size="8" text-anchor="middle">HC-SR501</text>
  <line x1="125" y1="337" x2="430" y2="471" stroke="#f97316" stroke-width="1.5"/>
  <text x="270" y="430" fill="#f97316" font-size="8">GPIO27</text>

  <!-- Soil Moisture -->
  <rect x="40" y="375" width="80" height="40" fill="#1e3a5f" stroke="#2ea043" stroke-width="1.5" rx="4"/>
  <text x="80" y="392" fill="#2ea043" font-size="9" text-anchor="middle" font-weight="bold">Soil Sensor</text>
  <text x="80" y="403" fill="#94a3b8" font-size="8" text-anchor="middle">Moisture</text>
  <line x1="120" y1="392" x2="430" y2="485" stroke="#2ea043" stroke-width="1.5"/>
  <text x="270" y="468" fill="#2ea043" font-size="8">GPIO32 (ADC)</text>

  <!-- LDR -->
  <rect x="55" y="430" width="60" height="36" fill="#1e3a5f" stroke="#fbbf24" stroke-width="1.5" rx="4"/>
  <text x="85" y="447" fill="#fbbf24" font-size="9" text-anchor="middle" font-weight="bold">LDR</text>
  <text x="85" y="458" fill="#94a3b8" font-size="8" text-anchor="middle">10k divider</text>
  <line x1="115" y1="447" x2="430" y2="513" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="270" y="500" fill="#fbbf24" font-size="8">GPIO34 (ADC)</text>

  <!-- Rain Sensor -->
  <rect x="40" y="478" width="80" height="36" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5" rx="4"/>
  <text x="80" y="495" fill="#60a5fa" font-size="9" text-anchor="middle" font-weight="bold">Rain Sensor</text>
  <text x="80" y="506" fill="#94a3b8" font-size="8" text-anchor="middle">Digital out</text>
  <line x1="120" y1="495" x2="430" y2="541" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="270" y="534" fill="#60a5fa" font-size="8">GPIO36 (input only)</text>

  <!-- FSR -->
  <rect x="55" y="528" width="60" height="36" fill="#1e3a5f" stroke="#c084fc" stroke-width="1.5" rx="4"/>
  <text x="85" y="545" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">FSR</text>
  <text x="85" y="556" fill="#94a3b8" font-size="8" text-anchor="middle">Force 10k÷</text>
  <line x1="115" y1="545" x2="430" y2="555" stroke="#c084fc" stroke-width="1.5"/>
  <text x="270" y="548" fill="#c084fc" font-size="8">GPIO39 (ADC)</text>

  <!-- Buttons -->
  <rect x="55" y="580" width="60" height="30" fill="#1e3a5f" stroke="#4ade80" stroke-width="1.5" rx="3"/>
  <text x="85" y="595" fill="#4ade80" font-size="8" text-anchor="middle" font-weight="bold">BTN1 Exit</text>
  <text x="85" y="604" fill="#94a3b8" font-size="7" text-anchor="middle">PULLUP→GND</text>
  <line x1="115" y1="593" x2="430" y2="457" stroke="#4ade80" stroke-width="1.5"/>

  <rect x="55" y="620" width="60" height="30" fill="#1e3a5f" stroke="#86efac" stroke-width="1.5" rx="3"/>
  <text x="85" y="635" fill="#86efac" font-size="8" text-anchor="middle" font-weight="bold">BTN2 Page</text>
  <text x="85" y="644" fill="#94a3b8" font-size="7" text-anchor="middle">ext 10k↑3V3</text>
  <line x1="115" y1="633" x2="430" y2="527" stroke="#86efac" stroke-width="1.5"/>

  <!-- ═══ RIGHT SIDE COMPONENTS ═══ -->

  <!-- RFID RC522 -->
  <rect x="780" y="80" width="90" height="90" fill="#1e3a5f" stroke="#a78bfa" stroke-width="1.5" rx="4"/>
  <text x="825" y="108" fill="#a78bfa" font-size="9" text-anchor="middle" font-weight="bold">RFID</text>
  <text x="825" y="120" fill="#a78bfa" font-size="9" text-anchor="middle" font-weight="bold">RC522</text>
  <text x="825" y="133" fill="#dc2626" font-size="8" text-anchor="middle">3.3V ONLY</text>
  <text x="825" y="145" fill="#94a3b8" font-size="7" text-anchor="middle">SS SCK MISO</text>
  <text x="825" y="155" fill="#94a3b8" font-size="7" text-anchor="middle">MOSI RST</text>
  <line x1="780" y1="100" x2="614" y2="145" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="780" y1="110" x2="614" y2="161" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="780" y1="120" x2="614" y2="177" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="780" y1="130" x2="614" y2="193" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="780" y1="140" x2="614" y2="209" stroke="#a78bfa" stroke-width="1.5"/>

  <!-- 4-Channel Relay -->
  <rect x="760" y="220" width="120" height="120" fill="#1e3a5f" stroke="#f87171" stroke-width="1.5" rx="4"/>
  <text x="820" y="245" fill="#f87171" font-size="10" text-anchor="middle" font-weight="bold">4-CH RELAY</text>
  <text x="820" y="258" fill="#64748b" font-size="8" text-anchor="middle">Active LOW</text>
  <text x="820" y="272" fill="#fbbf24" font-size="8" text-anchor="middle">IN1=GPIO15 Fan</text>
  <text x="820" y="284" fill="#fbbf24" font-size="8" text-anchor="middle">IN2=GPIO16 Light</text>
  <text x="820" y="296" fill="#fbbf24" font-size="8" text-anchor="middle">IN3=GPIO25 Door</text>
  <text x="820" y="308" fill="#fbbf24" font-size="8" text-anchor="middle">IN4=GPIO33 Pump</text>
  <text x="820" y="325" fill="#dc2626" font-size="7" text-anchor="middle">COM→230V Load→NO</text>
  <line x1="760" y1="268" x2="614" y2="205" stroke="#f87171" stroke-width="1.5"/>
  <line x1="760" y1="280" x2="430" y2="219" stroke="#f87171" stroke-width="1.5"/>
  <line x1="760" y1="292" x2="430" y2="443" stroke="#f87171" stroke-width="1.5"/>
  <line x1="760" y1="304" x2="430" y2="499" stroke="#f87171" stroke-width="1.5"/>

  <!-- LCD -->
  <rect x="760" y="380" width="120" height="60" fill="#1e3a5f" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
  <text x="820" y="400" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">LCD 16x2</text>
  <text x="820" y="412" fill="#94a3b8" font-size="8" text-anchor="middle">I2C Backpack</text>
  <text x="820" y="424" fill="#94a3b8" font-size="7" text-anchor="middle">SDA=21 SCL=22</text>
  <line x1="760" y1="405" x2="430" y2="401" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="760" y1="415" x2="430" y2="415" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Power rail labels -->
  <rect x="820" y="480" width="120" height="80" fill="#1a1a1a" stroke="#475569" stroke-width="1" rx="4"/>
  <text x="880" y="498" fill="#475569" font-size="9" text-anchor="middle" font-weight="bold">POWER</text>
  <text x="880" y="512" fill="#dc2626" font-size="8" text-anchor="middle">5V → ESP32 VIN</text>
  <text x="880" y="524" fill="#dc2626" font-size="8" text-anchor="middle">5V → HC-SR04</text>
  <text x="880" y="536" fill="#dc2626" font-size="8" text-anchor="middle">5V → PIR, Relay</text>
  <text x="880" y="548" fill="#4ade80" font-size="8" text-anchor="middle">3.3V → RFID</text>
  <text x="880" y="555" fill="#4ade80" font-size="8" text-anchor="middle">only (never 5V!)</text>

  <!-- GND rail -->
  <rect x="820" y="580" width="120" height="30" fill="#1e293b" stroke="#475569" stroke-width="1" rx="3"/>
  <text x="880" y="599" fill="#94a3b8" font-size="9" text-anchor="middle">Common GND</text>

  <!-- Legend -->
  <rect x="30" y="750" width="500" height="130" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="280" y="772" fill="#f0f6fc" font-size="11" text-anchor="middle" font-weight="bold">Legend</text>
  <line x1="50" y1="790" x2="90" y2="790" stroke="#4ade80" stroke-width="2"/>  <text x="100" y="794" fill="#94a3b8" font-size="9">DHT11 / Buttons (3.3V)</text>
  <line x1="50" y1="808" x2="90" y2="808" stroke="#60a5fa" stroke-width="2"/>  <text x="100" y="812" fill="#94a3b8" font-size="9">HC-SR04 / Rain (5V — via converter)</text>
  <line x1="50" y1="826" x2="90" y2="826" stroke="#f97316" stroke-width="2"/>  <text x="100" y="830" fill="#94a3b8" font-size="9">PIR Motion Sensor</text>
  <line x1="50" y1="844" x2="90" y2="844" stroke="#f87171" stroke-width="2"/>  <text x="100" y="848" fill="#94a3b8" font-size="9">Relay outputs (Active LOW)</text>
  <line x1="50" y1="862" x2="90" y2="862" stroke="#a78bfa" stroke-width="2"/>  <text x="100" y="866" fill="#94a3b8" font-size="9">RFID RC522 (3.3V only)</text>
  <line x1="280" y1="790" x2="320" y2="790" stroke="#fbbf24" stroke-width="2"/> <text x="330" y="794" fill="#94a3b8" font-size="9">LDR / Buzzer</text>
  <line x1="280" y1="808" x2="320" y2="808" stroke="#2ea043" stroke-width="2"/> <text x="330" y="812" fill="#94a3b8" font-size="9">Soil Moisture (ADC)</text>
  <line x1="280" y1="826" x2="320" y2="826" stroke="#38bdf8" stroke-width="2"/> <text x="330" y="830" fill="#94a3b8" font-size="9">LCD 16x2 I2C</text>
  <line x1="280" y1="844" x2="320" y2="844" stroke="#c084fc" stroke-width="2"/> <text x="330" y="848" fill="#94a3b8" font-size="9">FSR Force Sensor</text>
  <text x="330" y="866" fill="#dc2626" font-size="9">⚠ 230V relay load — never near breadboard</text>

  <!-- Key note -->
  <rect x="550" y="750" width="620" height="130" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <text x="860" y="772" fill="#fde68a" font-size="11" text-anchor="middle" font-weight="bold">Key Notes</text>
  <text x="560" y="792" fill="#94a3b8" font-size="9">• All relays ACTIVE LOW: LOW=ON, HIGH=OFF</text>
  <text x="560" y="808" fill="#94a3b8" font-size="9">• digitalWrite() before pinMode() in setup() — prevents boot glitch</text>
  <text x="560" y="824" fill="#dc2626" font-size="9">• RFID must use 3.3V — 5V destroys RC522 permanently</text>
  <text x="560" y="840" fill="#94a3b8" font-size="9">• HC-SR04 ECHO must go through logic converter (5V output)</text>
  <text x="560" y="856" fill="#94a3b8" font-size="9">• Soil ADC INVERTED: Dry=HIGH (>3000), Wet=LOW (&lt;1000)</text>
  <text x="560" y="872" fill="#94a3b8" font-size="9">• PIR ignored for first 60s after boot (warm-up period)</text>
</svg>
